
<!DOCTYPE html>
<html>
<head>
    <title>Spendly - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Spendly.</h1>
        <p>Student Expense Tracker</p>
    </header>

    <div class="container">

        <h2>Welcome Back!</h2>
        <p>Keep track of your spending.</p>

        <!-- Total Expenses -->
        <div class="dashboard">
            <div class="card">
                <h3>Total Expenses</h3>
                <h2 id="total">₹0</h2>
            </div>

            <div class="card">
                <h3>Number of Expenses</h3>
                <h2 id="count">0</h2>
            </div>
        </div>

        <!-- Add Expense -->
        <div class="section">
            <h2>Add New Expense</h2>

            <form id="expenseForm">

                <label>Expense Name</label>
                <input type="text" id="name" placeholder="Enter expense name">

                <label>Amount (₹)</label>
                <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01">

                <label>Category</label>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">+ Add Expense</button>

                <p id="error"></p>

            </form>
        </div>

        <!-- Expense List -->
        <div class="section">

            <h2>Recent Expenses</h2>

            <label>Filter by Category:</label>

            <select id="filter">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <div id="expenseList">
                <p>No expenses added yet.</p>
            </div>

        </div>

    </div>

    <footer>
        Made with ♡ | Spendly © 2026
    </footer>

    <script src="script.js"></script>

</body>
</html>
